name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs first. If the cloud description has a missing tag or a bad name, this job fails
  # and the deploy job below never starts.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the cloud description (names and tags)
        run: node tools/check-cloud.js

  # Runs at the same time as check. The tests open the site in a real browser, served from this checkout.
  # If one fails, the deploy job below never starts.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the test tools
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests
        run: npx playwright test
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # one name per attempt: an artifact name can be used only once in a run, so a re-run would clash
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the deployed copy is changed: the file in the repository keeps its committed date.
      - name: Stamp the build date in health.json
        run: |
          jq --arg date "$(date -u +%F)" '.buildDate = $date' health.json > health.stamped.json
          mv health.stamped.json health.json
          cat health.json
      # Every attempt gets its own artifact name. When a run is re-run, the artifact of the earlier attempt is
      # still there, and deploy-pages stops with "Multiple artifacts named github-pages were unexpectedly found".
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
